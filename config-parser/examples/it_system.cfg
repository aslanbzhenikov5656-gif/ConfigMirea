{{!--
Конфигурация серверной системы
--}}

const base_cpu = 4;
const extra_cpu = 2;
const base_memory = 16;

const total_cpu = $base_cpu + extra_cpu$;
const total_memory = $base_memory + 8$;

<<
  q(system),
  <<
    q(cpu),
    $total_cpu$,
    q(memory),
    $total_memory$
  >>,
  <<
    q(nodes),
    <<
      <<
        q(node),
        $1$,
        q(cpu),
        $base_cpu$
      >>,
      <<
        q(node),
        $2$,
        q(cpu),
        $total_cpu$
      >>
    >>
  >>
>>;
