{{!--
Финансовый бюджет проекта
--}}

const income = 150000;
const expenses = 40000;
const reserve = 10000;

const profit = $income - expenses - reserve$;

<<
  q(budget),
  <<
    q(income),
    $income$
  >>,
  <<
    q(expenses),
    $expenses$
  >>,
  <<
    q(reserve),
    $reserve$
  >>,
  <<
    q(result),
    $profit$
  >>
>>;
